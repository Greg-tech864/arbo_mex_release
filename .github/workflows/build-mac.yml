name: Empaquetar Flet iOS (Sin firma forzada)
on: [workflow_dispatch]

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y dependencias
        run: |
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generar proyecto Flutter con Flet (ignorando error de firma)
        run: flet build ipa || true

      - name: Compilar con Xcode desactivando firma a la fuerza
        run: |
          cd build/flutter/ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Crear archivo .ipa manualmente
        run: |
          mkdir -p Payload
          cp -r build/flutter/build/ios/Release-iphoneos/Runner.app Payload/
          zip -r MiApp-sin-firma.ipa Payload/

      - name: Subir .ipa generado
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-iOS-Unsigned
          path: MiApp-sin-firma.ipa

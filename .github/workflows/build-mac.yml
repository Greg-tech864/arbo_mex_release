name: Empaquetar Flet iOS (Sin firma)
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y dependencias
        run: |
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar bundle sin firma con Flet
        run: flet build ios-simulator --no-rich-output

      - name: Empaquetar .app en .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios-simulator/*.app Payload/
          zip -r MiApp-iOS.ipa Payload/

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-iOS
          path: MiApp-iOS.ipa

name: Compilar App (Android e iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: Compilar Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java (Requerido por Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y dependencias
        run: |
          pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar APK
        run: flet build apk --no-rich-output

      - name: Guardar build Android
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/apk/*.apk

  ios:
    name: Compilar iOS sin firma (IPA)
    runs-on: macos-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y dependencias
        run: |
          pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Parchear Flet para compilar iOS sin firma y conservar build
        run: |
          python3 -c '
          import os, flet_cli
          cli_dir = os.path.dirname(flet_cli.__file__)
          for root, _, files in os.walk(cli_dir):
              for f in files:
                  if f.endswith(".py"):
                      p = os.path.join(root, f)
                      txt = open(p).read()
                      if "\"ipa\"" in txt and "build" in txt:
                          txt = txt.replace("[\"build\", \"ipa\"", "[\"build\", \"ios\", \"--no-codesign\"")
                          txt = txt.replace("\x27build\x27, \x27ipa\x27", "\x27build\x27, \x27ios\x27, \x27--no-codesign\x27")
                          open(p, "w").write(txt)
          '

      - name: Compilar iOS sin firma
        run: |
          flet build ipa --no-rich-output || true

      - name: Empaquetar .app a .ipa
        run: |
          mkdir -p Payload
          find / -name "Runner.app" 2>/dev/null -exec cp -r {} Payload/ \;
          if [ -z "$(ls -A Payload)" ]; then
            echo "Error: No se encontró Runner.app"
            exit 1
          fi
          zip -r arbo_mex_release_ios.ipa Payload/

      - name: Guardar build iOS
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: arbo_mex_release_ios.ipa

name: Empaquetar para macOS
on: [workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Generar ejecutable
        run: pyinstaller --onefile --windowed tu_script.py
      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/
